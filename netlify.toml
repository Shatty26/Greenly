# Netlify configuration
# Build command and publish directory are configured in the Netlify UI.

[build.environment]
  # These VITE_* values are public, client-side configuration that Vite inlines
  # into the browser bundle by design (Firebase web API keys are project
  # identifiers protected by Firebase Security Rules, not secret credentials).
  # They are listed here so Netlify's secrets scanner does not flag their
  # presence in the build output as exposed secrets.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MEASUREMENT_ID,VITE_GEMINI_API_KEY,VITE_PAYPAL_CLIENT_ID"
